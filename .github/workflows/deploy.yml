name: Tests y despliegue

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Sin el secreto (p. ej. en PRs de forks) se publica solo la web del piso
      HAS_TAI_TOKEN: ${{ secrets.AGENTE_TAI_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # La conexión a Supabase puede venir de .env.production (en el repo) o de las
      # variables del repositorio; si existen las variables, tienen prioridad.
      - name: Configuración de Supabase desde variables del repositorio
        if: vars.VITE_SUPABASE_URL != ''
        run: printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "${{ vars.VITE_SUPABASE_URL }}" "${{ vars.VITE_SUPABASE_ANON_KEY }}" > .env.production.local
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # App de estudio TAI: vive en el repositorio privado agente-tai y se publica en /tai/
      - uses: actions/checkout@v4
        if: env.HAS_TAI_TOKEN == 'true'
        with:
          repository: ivaan2604/agente-tai
          token: ${{ secrets.AGENTE_TAI_TOKEN }}
          path: agente-tai
          sparse-checkout: app
      - name: Construir la app TAI
        if: env.HAS_TAI_TOKEN == 'true'
        working-directory: agente-tai/app
        run: npm ci && npm test && npm run build
      - if: env.HAS_TAI_TOKEN == 'true'
        run: cp -r agente-tai/app/dist dist/tai
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
